name: Android CI (build + unit test)

# Kapan berjalan: setiap push ke branch utama dan setiap pull request.
# Tujuannya menangkap kesalahan kompilasi/unit test SEBELUM APK dibagikan,
# bukan menggantikan pengujian manual di perangkat.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + jalankan unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # google-services.json tidak di-commit (berisi kunci Firebase). Untuk
      # pemeriksaan kompilasi, berkas tiruan dengan struktur yang benar sudah
      # cukup — plugin hanya memvalidasi bentuknya. Build rilis tetap memakai
      # berkas asli dari mesin developer.
      - name: Buat google-services.json tiruan (hanya untuk CI)
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "petheal-ci",
              "storage_bucket": "petheal-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.christopheraldoo.petheal" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # local.properties tidak di-commit. Nilai di bawah hanya placeholder agar
      # buildConfigField terisi; CI tidak menghubungi backend atau Midtrans.
      - name: Buat local.properties placeholder
        run: |
          cat > local.properties <<'PROPS'
          sdk.dir=/usr/local/lib/android/sdk
          BACKEND_BASE_URL=https://example.com/api/
          MIDTRANS_CLIENT_KEY=ci-placeholder
          MIDTRANS_MERCHANT_ID=ci-placeholder
          MIDTRANS_BASE_URL=https://app.sandbox.midtrans.com/snap/v1/
          MIDTRANS_SNAP_URL=https://app.sandbox.midtrans.com/snap/v2/vtweb/
          GOOGLE_CLIENT_ID=ci-placeholder
          PROPS

      - name: Build debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit test (JVM, tanpa perangkat)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Simpan laporan unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Simpan APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
