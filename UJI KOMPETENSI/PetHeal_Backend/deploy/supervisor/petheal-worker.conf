; Ganti /var/www/petheal/current dengan path aplikasi produksi.
[program:petheal-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/petheal/current/artisan queue:work --sleep=1 --tries=3 --timeout=90 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/petheal/current/storage/logs/worker.log
stopwaitsecs=3600
